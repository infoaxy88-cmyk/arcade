(function () {
  var mq = window.matchMedia ? window.matchMedia('(hover: none) and (pointer: coarse)') : null;

<style>
/* Layout: colonne di informazioni ai lati di un campo 11x15; su smartphone le statistiche diventano una riga sopra il campo e i comandi stanno sotto. */
:root {
  --bg: #0a1020;
  --panel: #111a33;
  --line: #27375f;
  --fg: #e2eaff;
  --muted: #8193c4;
  --accent: #ffd23f;
  --on-accent: #0a1020;
  --well: #060b17;
  --grid: #101a30;
  --veil: rgba(6, 11, 23, 0.84);
  --scan: rgba(0, 0, 0, 0.16);
  --display: 'Press Start 2P', 'Courier New', monospace;
  --text: 'IBM Plex Mono', ui-monospace, 'Courier New', monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--text);
  font-size: 14px;
  padding-block: 20px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
}
.app { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
h1 { margin: 0; font-family: var(--display); font-size: 14px; font-weight: 400; letter-spacing: 0.08em; color: var(--accent); text-transform: uppercase; }
.top-actions { display: flex; gap: 8px; }

.btn {
  font-family: var(--display); font-size: 9px; letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--fg); background: var(--panel); border: 2px solid var(--line);
  padding: 10px 12px; cursor: pointer; border-radius: 0;
}
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: 0.4; cursor: default; }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-size: 11px; padding: 12px 18px; }

.game {
  display: grid; gap: 12px; justify-content: center; align-items: start;
  grid-template-columns: auto 160px;
  grid-template-areas: "board stats" "board bonus" "board help";
  grid-template-rows: auto auto 1fr;
}
.panel { background: var(--panel); border: 2px solid var(--line); padding: 10px; min-width: 0; }
.panel h2 { margin: 0 0 10px; font-family: var(--display); font-size: 9px; font-weight: 400; letter-spacing: 0.1em; color: var(--muted); text-transform: uppercase; }
.stats { grid-area: stats; }
.bonus { grid-area: bonus; }
.help { grid-area: help; }

.stat-list { margin: 0; display: flex; flex-direction: column; gap: 12px; }
.stat-list div { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.stat-list dt { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
.stat-list dd { margin: 0; font-family: var(--display); font-size: 12px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; min-height: 18px; }
#score { color: var(--accent); }
.pips { display: flex; gap: 4px; align-items: center; min-height: 18px; }
.pip { width: 10px; height: 10px; background: #ff4d5e; box-shadow: inset 2px 2px 0 rgba(255,255,255,0.45), inset -2px -2px 0 rgba(0,0,0,0.4); }

.keys { margin: 0; display: flex; flex-direction: column; gap: 8px; font-size: 11px; }
.keys div { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.keys dt { display: flex; gap: 3px; flex-wrap: wrap; align-items: center; }
.keys dd { margin: 0; color: var(--muted); text-align: right; }
kbd { font-family: var(--text); font-size: 10px; background: var(--well); border: 1px solid var(--line); padding: 2px 5px; color: var(--fg); }
.chip { display: inline-block; width: 22px; height: 14px; line-height: 14px; text-align: center; font-family: var(--display); font-size: 8px; color: var(--on-accent); background: var(--c); box-shadow: inset 2px 2px 0 rgba(255,255,255,0.45), inset -2px -2px 0 rgba(0,0,0,0.4); }

.board-area { grid-area: board; display: flex; justify-content: center; align-items: flex-start; min-width: 0; }
.board-wrap { position: relative; border: 3px solid var(--line); background: var(--well); line-height: 0; }
#board { display: block; height: min(72vh, 640px); height: min(72svh, 640px); aspect-ratio: 352 / 480; width: auto; touch-action: none; }
.board-wrap::after { content: ""; position: absolute; inset: 0; z-index: 2; pointer-events: none; background: repeating-linear-gradient(to bottom, transparent 0 2px, var(--scan) 2px 3px); }

.toast { position: absolute; z-index: 4; left: 0; right: 0; top: 50%; text-align: center; font-family: var(--display); font-size: 13px; line-height: 1.4; color: var(--accent); text-shadow: 2px 2px 0 var(--well); opacity: 0; transition: opacity 0.2s; pointer-events: none; }
.toast.show { opacity: 1; }

.overlay { position: absolute; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 20px; text-align: center; background: var(--veil); line-height: 1.5; }
.ov-title { margin: 0; font-family: var(--display); font-size: 15px; line-height: 1.4; color: var(--accent); text-transform: uppercase; text-wrap: balance; }
.ov-sub { margin: 0; font-size: 13px; max-width: 26ch; }
.ov-hint { margin: 0; font-size: 11px; color: var(--muted); }

.touch { display: none; }
.touch-group {
  display: grid; gap: 8px; width: 100%;
  grid-template-columns: repeat(3, 1fr) 1.3fr; grid-template-rows: repeat(2, 50px);
  grid-template-areas: ". up . bomb" "left down right bomb";
}
.pad { min-height: 0; font-size: 11px; touch-action: none; user-select: none; -webkit-user-select: none; }
.pad[data-act="up"] { grid-area: up; }
.pad[data-act="down"] { grid-area: down; }
.pad[data-act="left"] { grid-area: left; }
.pad[data-act="right"] { grid-area: right; }
.pad[data-act="bomb"] { grid-area: bomb; background: var(--accent); color: var(--on-accent); border-color: var(--accent); }

@media (max-width: 700px) {
  .game { grid-template-columns: 1fr; grid-template-areas: "stats" "board" "bonus"; gap: 8px; }
  .help { display: none; }
  .stat-list { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .stat-list dd { font-size: 10px; }
  #board { height: min(60vh, 560px); height: min(60svh, 560px); }
}

/* ---- Smartphone: la classe .mobile sul root si attiva solo su dispositivi touch senza mouse ---- */
html.mobile, .mobile body { height: 100%; overflow: hidden; overscroll-behavior: none; }
.mobile body {
  padding-block: 8px;
  touch-action: manipulation;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
.mobile .app {
  display: grid; height: 100%; max-width: 560px; gap: 8px;
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: auto auto minmax(0, 1fr) auto;
  grid-template-areas: "hdr" "stats" "board" "pad";
}
.mobile .game { display: contents; }
.mobile h1 { display: none; }
.mobile header { grid-area: hdr; display: block; }
.mobile .top-actions { gap: 8px; }
.mobile .top-actions .btn { flex: 1; padding: 8px 10px; }
.mobile .help, .mobile .bonus, .mobile .stats h2, .mobile .ov-hint { display: none; }
.mobile .stats { grid-area: stats; padding: 6px 8px; }
.mobile .stat-list { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.mobile .stat-list div { gap: 2px; }
.mobile .stat-list dt { font-size: 9px; }
.mobile .stat-list dd { font-family: var(--text); font-weight: 600; font-size: 13px; min-height: 18px; }
.mobile .board-area { grid-area: board; position: relative; align-items: stretch; overflow: hidden; min-height: 0; }
.mobile .board-wrap { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
.mobile .overlay { gap: 10px; padding: 12px; }
.mobile .ov-title, .mobile .ov-sub { font-size: 11px; }
.mobile .toast { font-size: 10px; }
.mobile .touch { grid-area: pad; display: flex; flex-direction: column; gap: 8px; width: 100%; }
.mobile .pad { font-size: 9px; padding-inline: 4px; white-space: nowrap; }
.mobile .pad.arrow { font-family: var(--text); font-size: 22px; font-weight: 600; }
@media (orientation: landscape) {
  .mobile .app {
    max-width: none; gap: 8px 12px;
    grid-template-columns: minmax(0, 1fr) calc((100vh - 24px) * 0.7333) minmax(0, 1fr);
    grid-template-columns: minmax(0, 1fr) calc((100dvh - 24px) * 0.7333) minmax(0, 1fr);
    grid-template-rows: auto auto minmax(0, 1fr);
    grid-template-areas: "hdr board pad" "stats board pad" ". board pad";
  }
  .mobile .stat-list { grid-template-columns: 1fr 1fr; }
  .mobile .touch-group {
    grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 46px);
    grid-template-areas: ". up ." "left down right" "bomb bomb bomb";
  }
}
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
a.btn { display: inline-block; text-align: center; text-decoration: none; }
</style>

<script>
(() => {
  'use strict';

  const T = 32, COLS = 11, ROWS = 15, W = COLS * T, H = ROWS * T, SC = 2;
  const RATIO = W / H;
  const MAX_BOMBS = 6, MAX_RANGE = 8, MAX_LIVES = 5, MAX_SPEEDUP = 3;
  const FUSE = 2.2, FLAME = 0.55;
  const STORAGE_KEY = 'bombe-arcade-record';

  const $ = (id) => document.getElementById(id);
  const boardCv = $('board');
  const ctx = boardCv.getContext('2d');
  const overlay = $('overlay'), ovTitle = $('ovTitle'), ovSub = $('ovSub'), ovBtn = $('ovBtn'), ovHint = $('ovHint');
  const pauseBtn = $('pauseBtn'), muteBtn = $('muteBtn'), toastEl = $('toast'), livesEl = $('lives');
  const rootEl = document.documentElement;
  const areaEl = document.querySelector('.board-area');

  const css = getComputedStyle(rootEl);
  const tok = (name, fallback) => css.getPropertyValue(name).trim() || fallback;
  const WELL = tok('--well', '#060b17'), GRIDC = tok('--grid', '#101a30'), ACCENT = tok('--accent', '#ffd23f');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const mobileMQ = window.matchMedia('(hover: none) and (pointer: coarse)');
  const detectMobile = () => mobileMQ.matches || /Android|iPhone|iPod/i.test(navigator.userAgent || '');
  const fmt = (n) => n.toLocaleString('it-IT');
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  const POW = {
    B: { c: '#3fe0ff', n: 'Più bombe' },
    F: { c: '#ff9a3c', n: 'Fiamma' },
    S: { c: '#4ade6a', n: 'Velocità' },
    V: { c: '#ff4d5e', n: 'Vita extra' }
  };
  const POW_BAG = ['B', 'B', 'B', 'F', 'F', 'F', 'S', 'S', 'V'];
  const FOE_COLORS = ['#ff4d5e', '#b866ff', '#ff9a3c'];
  const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
  const DIR_LIST = Object.values(DIRS);

  // ---- Colori ------------------------------------------------------------
  function mix(hex, target, p) {
    const n = parseInt(hex.slice(1), 16);
    const ch = [n >> 16, (n >> 8) & 255, n & 255].map((c) => Math.round(c + (target - c) * p));
    return 'rgb(' + ch.join(',') + ')';
  }
  const shadeCache = {};
  function shade(hex) {
    return shadeCache[hex] || (shadeCache[hex] = { base: hex, light: mix(hex, 255, 0.55), dark: mix(hex, 0, 0.45) });
  }
  function bevel(x, y, w, h, hex, b) {
    const c = shade(hex);
    ctx.fillStyle = c.base; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = c.light; ctx.fillRect(x, y, w, b); ctx.fillRect(x, y, b, h);
    ctx.fillStyle = c.dark; ctx.fillRect(x, y + h - b, w, b); ctx.fillRect(x + w - b, y, b, h);
  }

  // ---- Stato -------------------------------------------------------------
  let grid = [], item = [], hid = [], fire = [];
  let bombs = [], foes = [], particles = [];
  let doorC = 0, doorR = 0;
  let player = null;
  let score = 0, best = 0, level = 1, lives = 3;
  let maxBombs = 1, range = 2, speedUp = 0;
  let readyT = 0, invul = 0;
  let state = 'idle'; // idle | playing | paused | over
  let held = [];
  let last = performance.now();

  // ---- Audio -------------------------------------------------------------
  let actx = null, muted = false;
  function audio() {
    if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; } }
    if (actx && actx.state === 'suspended') actx.resume();
    return actx;
  }
  function tone(freq, dur, type, vol, when, slideTo) {
    if (muted || !actx) return;
    const t = actx.currentTime + (when || 0);
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(vol || 0.04, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }
  const sfx = {
    drop: () => tone(180, 0.06, 'square', 0.04, 0, 120),
    boom: () => { tone(140, 0.35, 'sawtooth', 0.06, 0, 40); tone(80, 0.3, 'square', 0.04, 0, 30); },
    block: () => tone(260, 0.05, 'triangle', 0.04),
    foe: () => { tone(520, 0.05, 'square', 0.04); tone(780, 0.08, 'square', 0.04, 0.05); },
    power: () => { [523, 784, 1047].forEach((f, i) => tone(f, 0.08, 'square', 0.035, i * 0.06)); },
    life: () => tone(330, 0.5, 'sawtooth', 0.05, 0, 60),
    level: () => { [659, 784, 988, 1319].forEach((f, i) => tone(f, 0.1, 'square', 0.04, i * 0.08)); },
    over: () => tone(330, 0.9, 'sawtooth', 0.05, 0, 40)
  };

  // ---- Livello -----------------------------------------------------------
  const inside = (c, r) => c >= 0 && c < COLS && r >= 0 && r < ROWS;
  const bombAt = (c, r) => bombs.some((b) => b.c === c && b.r === r);
  const canEnter = (c, r) => inside(c, r) && grid[r][c] === 0 && !bombAt(c, r);
  const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };

  function makeActor(c, r, speed) {
    return { c, r, fc: c, fr: r, x: c * T + T / 2, y: r * T + T / 2, moving: false, speed, dir: null };
  }

  function loadLevel() {
    grid = []; item = []; hid = []; fire = [];
    const soft = [], empty = [];
    for (let r = 0; r < ROWS; r++) {
      grid.push([]); item.push([]); hid.push([]); fire.push([]);
      for (let c = 0; c < COLS; c++) {
        item[r].push(null); hid[r].push(null); fire[r].push(0);
        if (r % 2 === 1 && c % 2 === 1) { grid[r].push(1); continue; }
        if (c + r < 3) { grid[r].push(0); continue; }
        if (Math.random() < 0.52) { grid[r].push(2); soft.push([c, r]); }
        else { grid[r].push(0); if (c + r >= 8) empty.push([c, r]); }
      }
    }
    shuffle(soft);
    const door = soft.pop();
    doorC = door[0]; doorR = door[1]; hid[doorR][doorC] = 'D';
    const nPow = Math.min(soft.length, 5 + Math.round(soft.length * 0.12));
    for (let i = 0; i < nPow; i++) { const s = soft[i]; hid[s[1]][s[0]] = POW_BAG[(Math.random() * POW_BAG.length) | 0]; }
    bombs = []; particles = [];
    shuffle(empty);
    const n = Math.min(9, 3 + level);
    foes = [];
    for (let i = 0; i < n && i < empty.length; i++) {
      const f = makeActor(empty[i][0], empty[i][1], Math.min(88, 38 + level * 5) + Math.random() * 10);
      f.color = FOE_COLORS[i % FOE_COLORS.length];
      foes.push(f);
    }
    player = makeActor(0, 0, 0);
    invul = 1.5; readyT = 1.2;
  }

  const playerSpeed = () => 94 + speedUp * 22;

  // ---- Movimento ---------------------------------------------------------
  function moveActor(e, dt, speed, want) {
    let rem = speed * dt;
    for (let i = 0; i < 4 && rem > 0; i++) {
      const w = want(e);
      if (!e.moving) {
        if (!w) break;
        const nc = e.c + w[0], nr = e.r + w[1];
        if (!canEnter(nc, nr)) break;
        e.fc = e.c; e.fr = e.r; e.c = nc; e.r = nr; e.moving = true;
      } else if (w && w[0] === e.fc - e.c && w[1] === e.fr - e.r) {
        const tc = e.c, tr = e.r; e.c = e.fc; e.r = e.fr; e.fc = tc; e.fr = tr;
      }
      const tx = e.c * T + T / 2, ty = e.r * T + T / 2;
      const dx = tx - e.x, dy = ty - e.y, d = Math.hypot(dx, dy);
      if (d <= rem) { e.x = tx; e.y = ty; rem -= d; e.moving = false; }
      else { e.x += dx / d * rem; e.y += dy / d * rem; rem = 0; }
    }
  }
  const tileOf = (e) => [Math.floor(e.x / T), Math.floor(e.y / T)];

  function foeWant(f) {
    if (f.moving) return null;
    const opts = DIR_LIST.filter((d) => canEnter(f.c + d[0], f.r + d[1]));
    if (!opts.length) { f.dir = null; return null; }
    if (f.dir && Math.random() < 0.75 && opts.some((d) => d[0] === f.dir[0] && d[1] === f.dir[1])) return f.dir;
    let pool = opts.filter((d) => !f.dir || !(d[0] === -f.dir[0] && d[1] === -f.dir[1]));
    if (!pool.length) pool = opts;
    if (level >= 2 && Math.random() < 0.3 && player) {
      const [pc, pr] = tileOf(player);
      const best = pool.slice().sort((a, b) => (Math.abs(f.c + a[0] - pc) + Math.abs(f.r + a[1] - pr)) - (Math.abs(f.c + b[0] - pc) + Math.abs(f.r + b[1] - pr)))[0];
      f.dir = best;
    } else f.dir = pool[(Math.random() * pool.length) | 0];
    return f.dir;
  }
  const playerWant = () => {
    const k = held[held.length - 1];
    return k ? DIRS[k] : null;
  };

  // ---- Bombe ed esplosioni ----------------------------------------------
  function placeBomb() {
    if (state !== 'playing' || readyT > 0) return;
    if (bombs.length >= maxBombs) return;
    const [c, r] = tileOf(player);
    if (bombAt(c, r)) return;
    bombs.push({ c, r, t: FUSE, rng: range });
    sfx.drop();
  }

  function addParticles(x, y, color, n) {
    if (reduceMotion) return;
    for (let i = 0; i < (n || 6); i++) {
      particles.push({ x, y, vx: (Math.random() - 0.5) * 160, vy: -Math.random() * 120 - 20, life: 0.45, color });
    }
  }

  function igniteCell(c, r) {
    // Restituisce true se la fiamma può proseguire oltre questa cella.
    if (grid[r][c] === 1) return false;
    fire[r][c] = FLAME;
    const other = bombs.find((b) => b.c === c && b.r === r);
    if (other) other.t = Math.min(other.t, 0);
    if (grid[r][c] === 2) {
      grid[r][c] = 0;
      score += 10 * level;
      sfx.block();
      addParticles(c * T + T / 2, r * T + T / 2, '#ff9a3c', 8);
      const h = hid[r][c];
      if (h) { item[r][c] = h; hid[r][c] = null; }
      return false;
    }
    if (item[r][c] && item[r][c] !== 'D') item[r][c] = null;
    return true;
  }
  function explode(b) {
    bombs.splice(bombs.indexOf(b), 1);
    sfx.boom();
    fire[b.r][b.c] = FLAME;
    for (const d of DIR_LIST) {
      for (let i = 1; i <= b.rng; i++) {
        const c = b.c + d[0] * i, r = b.r + d[1] * i;
        if (!inside(c, r)) break;
        if (!igniteCell(c, r)) break;
      }
    }
  }

  // ---- Raccolta, morte, avanzamento -------------------------------------
  function collect(type) {
    sfx.power();
    if (type === 'B') maxBombs = Math.min(MAX_BOMBS, maxBombs + 1);
    else if (type === 'F') range = Math.min(MAX_RANGE, range + 1);
    else if (type === 'S') speedUp = Math.min(MAX_SPEEDUP, speedUp + 1);
    else if (type === 'V') lives = Math.min(MAX_LIVES, lives + 1);
    score += 50 * level;
    toast(POW[type].n);
    updateStats();
  }
  function killPlayer() {
    lives--;
    sfx.life();
    addParticles(player.x, player.y, '#3fe0ff', 14);
    if (lives <= 0) { endGame(); return; }
    player = makeActor(0, 0, 0);
    invul = 2.5;
    held = [];
    toast(lives === 1 ? 'Ultima vita' : 'Vite: ' + lives);
    updateStats();
  }
  function levelClear() {
    sfx.level();
    score += 500 * level;
    level++;
    loadLevel();
    toast('Livello ' + level);
    updateStats();
  }

  function update(dt) {
    particles.forEach((p) => { p.life -= dt; p.vy += 400 * dt; p.x += p.vx * dt; p.y += p.vy * dt; });
    particles = particles.filter((p) => p.life > 0);
    if (state !== 'playing') return;
    if (readyT > 0) { readyT -= dt; return; }

    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (fire[r][c] > 0) fire[r][c] = Math.max(0, fire[r][c] - dt);
    if (invul > 0) invul -= dt;

    bombs.forEach((b) => { b.t -= dt; });
    let guard = 0, due;
    while ((due = bombs.find((b) => b.t <= 0)) && guard++ < 40) explode(due);

    moveActor(player, dt, playerSpeed(), playerWant);
    foes.forEach((f) => moveActor(f, dt, f.speed, foeWant));

    const [pc, pr] = tileOf(player);
    const it = item[pr][pc];
    if (it && it !== 'D') { item[pr][pc] = null; collect(it); }

    const before = foes.length;
    foes = foes.filter((f) => {
      const [fc, fr] = tileOf(f);
      if (fire[fr][fc] > 0) {
        score += 100 * level; sfx.foe(); addParticles(f.x, f.y, f.color, 10);
        return false;
      }
      return true;
    });
    if (foes.length !== before) {
      updateStats();
      if (!foes.length) toast('Trova l\'uscita');
    }

    if (invul <= 0) {
      if (fire[pr][pc] > 0 || foes.some((f) => Math.hypot(f.x - player.x, f.y - player.y) < 20)) { killPlayer(); return; }
    }

    if (!foes.length && pc === doorC && pr === doorR && grid[doorR][doorC] === 0) levelClear();
  }

  // ---- Disegno -----------------------------------------------------------
  function drawFoe(f, now) {
    const bob = Math.sin(now / 160 + f.x) * 1;
    const x = f.x - 11, y = f.y - 10 + bob;
    bevel(x, y, 22, 20, f.color, 2);
    ctx.fillStyle = '#e2eaff'; ctx.fillRect(x + 4, y + 5, 5, 6); ctx.fillRect(x + 13, y + 5, 5, 6);
    ctx.fillStyle = '#0a1020';
    const ox = f.dir ? f.dir[0] * 1 : 0, oy = f.dir ? f.dir[1] * 1 : 0;
    ctx.fillRect(x + 6 + ox, y + 7 + oy, 2, 3); ctx.fillRect(x + 15 + ox, y + 7 + oy, 2, 3);
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    const step = Math.floor(now / 140) % 2;
    ctx.fillRect(x + 3 + step * 2, y + 16, 4, 3); ctx.fillRect(x + 15 - step * 2, y + 16, 4, 3);
  }
  function drawPlayer(now) {
    if (invul > 0 && Math.floor(now / 90) % 2 === 0) return;
    const x = player.x - 10, y = player.y - 12;
    bevel(x, y + 8, 20, 16, '#3fe0ff', 2);
    bevel(x + 1, y, 18, 12, '#e2eaff', 2);
    ctx.fillStyle = ACCENT; ctx.fillRect(x + 1, y - 2, 18, 4);
    ctx.fillStyle = '#0a1020'; ctx.fillRect(x + 5, y + 5, 3, 4); ctx.fillRect(x + 12, y + 5, 3, 4);
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    const step = player.moving ? Math.floor(now / 100) % 2 : 0;
    ctx.fillRect(x + 2 + step * 2, y + 22, 5, 3); ctx.fillRect(x + 13 - step * 2, y + 22, 5, 3);
  }

  function draw(now) {
    const g = ctx;
    g.setTransform(SC, 0, 0, SC, 0, 0);
    g.fillStyle = WELL; g.fillRect(0, 0, W, H);
    g.strokeStyle = GRIDC; g.lineWidth = 1; g.beginPath();
    for (let x = 1; x < COLS; x++) { g.moveTo(x * T + 0.5, 0); g.lineTo(x * T + 0.5, H); }
    for (let y = 1; y < ROWS; y++) { g.moveTo(0, y * T + 0.5); g.lineTo(W, y * T + 0.5); }
    g.stroke();
    if (!grid.length) return;

    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const x = c * T, y = r * T, v = grid[r][c], it = item[r][c];
        if (v === 1) {
          bevel(x + 1, y + 1, T - 2, T - 2, '#56658c', 3);
          bevel(x + 8, y + 8, T - 16, T - 16, '#6f80aa', 2);
        } else if (v === 2) {
          bevel(x + 1, y + 1, T - 2, T - 2, '#c8693a', 3);
          g.fillStyle = 'rgba(0,0,0,0.3)';
          g.fillRect(x + 4, y + T / 2 - 1, T - 8, 2);
          g.fillRect(x + T / 2 - 1, y + 4, 2, T / 2 - 5);
          g.fillRect(x + 9, y + T / 2 + 1, 2, T / 2 - 5);
          g.fillRect(x + T - 11, y + T / 2 + 1, 2, T / 2 - 5);
        } else if (it === 'D') {
          const open = !foes.length;
          bevel(x + 3, y + 3, T - 6, T - 6, open && Math.floor(now / 250) % 2 === 0 ? ACCENT : '#4d7cff', 3);
          g.fillStyle = WELL; g.fillRect(x + 9, y + 9, T - 18, T - 18);
          g.fillStyle = ACCENT;
          g.fillRect(x + 11, y + 14, 6, 4); g.fillRect(x + 17, y + 11, 2, 10); g.fillRect(x + 19, y + 13, 2, 6);
        } else if (it) {
          const bob = Math.sin(now / 220 + c) * 1.5;
          bevel(x + 4, y + 9 + bob, 24, 14, POW[it].c, 2);
          g.fillStyle = '#0a1020'; g.font = '8px "Press Start 2P", monospace'; g.textAlign = 'center'; g.textBaseline = 'middle';
          g.fillText(it, x + T / 2, y + 17 + bob);
        }
      }
    }

    bombs.forEach((b) => {
      const x = b.c * T + T / 2, y = b.r * T + T / 2 + 1;
      const pulse = 1 + Math.sin(now / (b.t < 0.7 ? 40 : 120)) * 0.08;
      const rr = 11 * pulse;
      g.fillStyle = b.t < 0.7 && Math.floor(now / 80) % 2 === 0 ? '#ff4d5e' : '#1b2440';
      g.beginPath(); g.arc(x, y, rr, 0, Math.PI * 2); g.fill();
      g.fillStyle = 'rgba(255,255,255,0.35)'; g.fillRect(x - 6, y - 6, 4, 4);
      g.fillStyle = '#8193c4'; g.fillRect(x + 2, y - rr - 3, 3, 4);
      g.fillStyle = ACCENT; g.fillRect(x + 4, y - rr - 6 - (Math.floor(now / 90) % 2), 3, 3);
    });

    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        if (fire[r][c] <= 0) continue;
        const x = c * T, y = r * T, k = fire[r][c] / FLAME;
        g.globalAlpha = clamp(k * 1.6, 0.4, 1);
        bevel(x + 2, y + 2, T - 4, T - 4, '#ff9a3c', 3);
        bevel(x + 7, y + 7, T - 14, T - 14, ACCENT, 2);
        g.fillStyle = '#fff'; g.fillRect(x + 12, y + 12, T - 24, T - 24);
        g.globalAlpha = 1;
      }
    }

    foes.forEach((f) => drawFoe(f, now));
    if (player && state !== 'over') drawPlayer(now);

    particles.forEach((p) => {
      g.globalAlpha = clamp(p.life / 0.45, 0, 1);
      g.fillStyle = p.color; g.fillRect(p.x - 1.5, p.y - 1.5, 3, 3);
    });
    g.globalAlpha = 1;

    if (state === 'playing' && readyT > 0) {
      g.fillStyle = 'rgba(6,11,23,0.55)'; g.fillRect(0, H / 2 - 22, W, 44);
      g.fillStyle = ACCENT; g.font = '12px "Press Start 2P", monospace'; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText('LIVELLO ' + level, W / 2, H / 2);
    }
  }

  function updateStats() {
    $('score').textContent = fmt(score);
    $('best').textContent = fmt(Math.max(best, score));
    $('level').textContent = String(level);
    $('foes').textContent = String(foes.length);
    livesEl.textContent = '';
    for (let i = 0; i < lives; i++) { const s = document.createElement('span'); s.className = 'pip'; livesEl.appendChild(s); }
    livesEl.setAttribute('aria-label', 'Vite: ' + lives);
  }

  // ---- Flusso di gioco ---------------------------------------------------
  function showOverlay(title, sub, btn, hint) {
    ovTitle.textContent = title; ovSub.textContent = sub; ovBtn.textContent = btn; ovHint.textContent = hint;
    overlay.hidden = false;
  }
  function releaseAll() { held = []; }
  function start() {
    audio();
    score = 0; level = 1; lives = 3; maxBombs = 1; range = 2; speedUp = 0;
    loadLevel();
    releaseAll();
    state = 'playing';
    overlay.hidden = true;
    pauseBtn.disabled = false; pauseBtn.textContent = 'Pausa';
    updateStats();
    last = performance.now();
  }
  function pause() {
    if (state !== 'playing') return;
    state = 'paused'; releaseAll();
    showOverlay('Pausa', 'Il gioco è fermo.', 'Riprendi', 'P per riprendere');
    pauseBtn.textContent = 'Riprendi';
  }
  function resume() {
    if (state !== 'paused') return;
    state = 'playing'; overlay.hidden = true;
    pauseBtn.textContent = 'Pausa';
    last = performance.now();
  }
  function endGame() {
    state = 'over'; bombs = []; releaseAll();
    const record = score > best;
    if (record) { best = score; try { localStorage.setItem(STORAGE_KEY, String(best)); } catch (e) { /* ignore */ } }
    sfx.over();
    showOverlay('Fine partita', fmt(score) + ' punti · livello ' + level + (record ? ' · Nuovo record!' : ''), 'Rigioca', 'Invio o Spazio per ricominciare');
    pauseBtn.disabled = true; pauseBtn.textContent = 'Pausa';
    updateStats();
  }
  function toggleMute() {
    muted = !muted;
    muteBtn.textContent = muted ? 'Audio: no' : 'Audio: sì';
    muteBtn.setAttribute('aria-pressed', String(muted));
  }

  let toastTimer = 0;
  function toast(text) {
    toastEl.textContent = text; toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1100);
  }

  // ---- Comandi -----------------------------------------------------------
  const KEYMAP = {
    ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
    ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down',
    Space: 'bomb', Enter: 'enter', KeyP: 'pause', Escape: 'pause', KeyM: 'mute'
  };

  function press(act) {
    if (act === 'mute') { toggleMute(); return; }
    if (act === 'pause') { if (state === 'playing') pause(); else if (state === 'paused') resume(); return; }
    if (act === 'enter' || act === 'bomb') {
      if (state === 'idle' || state === 'over') start();
      else if (state === 'paused') resume();
      else if (act === 'bomb') placeBomb();
      return;
    }
    if (DIRS[act]) { held = held.filter((d) => d !== act); held.push(act); }
  }
  function release(act) { if (DIRS[act]) held = held.filter((d) => d !== act); }

  window.addEventListener('keydown', (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const act = KEYMAP[e.code];
    if (!act) return;
    if ((e.code === 'Space' || e.code === 'Enter') && e.target instanceof Element && e.target.closest('button')) return;
    e.preventDefault();
    if (e.repeat) return;
    press(act);
  });
  window.addEventListener('keyup', (e) => { const act = KEYMAP[e.code]; if (act) release(act); });
  window.addEventListener('blur', releaseAll);
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

  document.querySelectorAll('[data-act]').forEach((b) => {
    const act = b.dataset.act;
    b.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      try { b.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
      press(act);
    });
    const up = () => release(act);
    b.addEventListener('pointerup', up);
    b.addEventListener('pointercancel', up);
    b.addEventListener('lostpointercapture', up);
    b.addEventListener('contextmenu', (e) => e.preventDefault());
  });

  boardCv.addEventListener('contextmenu', (e) => e.preventDefault());
  ovBtn.addEventListener('click', () => { press('enter'); ovBtn.blur(); });
  pauseBtn.addEventListener('click', () => { press('pause'); pauseBtn.blur(); });
  muteBtn.addEventListener('click', () => { toggleMute(); muteBtn.blur(); });

  // Layout smartphone: il campo occupa tutto lo spazio libero mantenendo il rapporto del campo.
  function fitBoard() {
    if (!rootEl.classList.contains('mobile')) {
      boardCv.style.removeProperty('width'); boardCv.style.removeProperty('height');
      return;
    }
    const w = Math.floor(Math.min(areaEl.clientWidth - 8, (areaEl.clientHeight - 8) * RATIO));
    if (w < 120) return;
    boardCv.style.width = w + 'px';
    boardCv.style.height = Math.floor(w / RATIO) + 'px';
  }
  function applyMode() { rootEl.classList.toggle('mobile', detectMobile()); fitBoard(); }
  if (mobileMQ.addEventListener) mobileMQ.addEventListener('change', applyMode); else if (mobileMQ.addListener) mobileMQ.addListener(applyMode);
  window.addEventListener('resize', fitBoard);
  if (window.ResizeObserver) new ResizeObserver(fitBoard).observe(areaEl);

  // ---- Avvio -------------------------------------------------------------
  try { best = Number(localStorage.getItem(STORAGE_KEY)) || 0; } catch (e) { best = 0; }
  loadLevel();
  readyT = 0;
  applyMode();
  updateStats();

  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    update(dt);
    draw(now);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('../sw.js', { updateViaCache: 'none' }).catch(function () {});
  });
}
</script>
